version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor bumps; majors stay separate so they get read.
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/sdks/typescript"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
