name: publish-sdk

# Publishes the TypeScript SDK to npm via Trusted Publishing (OIDC), the same
# mechanism release.yml uses for PyPI. No NPM_TOKEN in this repository, in GitHub
# secrets, or on any developer machine -- GitHub proves the workflow's identity to
# npm directly. This also removes the passkey step that made every previous SDK
# release a manual, interactive act.
#
# One-time setup on npmjs.com (package settings -> Trusted Publisher):
#   Organization or user: NORTHTEKDevs
#   Repository:           genome
#   Workflow filename:    publish-sdk.yml
#   Allowed actions:      npm publish
#
# Tag the SDK separately from the Python package, whose versions move
# independently: sdk-v1.1.0, not v1.1.0.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # Same guard as release.yml: until the Trusted Publisher entry exists on
    # npmjs.com this job can only fail, and a tag should not leave a red run for
    # a release that shipped. Flip it when the entry is created:
    #   gh variable set NPM_TRUSTED_PUBLISHER --body true
    if: vars.NPM_TRUSTED_PUBLISHER == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC; this is the whole mechanism
      contents: read
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the bundled npm is older on some
      # runner images and the failure it produces ("unable to authenticate") does
      # not name the cause.
      - name: Ensure an npm that can do OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with package.json publishes a version nobody asked
        # for, and npm versions are immutable once published.
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          TAG="${GITHUB_REF_NAME#sdk-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag sdk-v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm test

      - name: Publish
        # No NODE_AUTH_TOKEN, deliberately: omitting it is what selects Trusted
        # Publishing. prepublishOnly runs the TypeScript build.
        run: npm publish --access public
