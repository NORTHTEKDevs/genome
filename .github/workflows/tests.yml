name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The package is developed on Windows and installed on macOS, but only Linux
        # was ever tested. One leg each converts the "OS Independent" claim from an
        # assumption into something CI actually proves. Kept to a single Python
        # version per OS to hold CI time down; Postgres stays Linux-only since it
        # needs a service container.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Lint with ruff
        run: ruff check genome tests

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke-run CLI
        run: genome-eval --limit-pairs 5 --output results/ci_smoke.json

  # Separate job: exercises the Postgres/pgvector backend against a real
  # Postgres 16 + pgvector service container. Runs alongside the SQLite matrix.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genome
          POSTGRES_PASSWORD: genome
          POSTGRES_DB: memorydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genome -d memorydb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with Postgres extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ubuntu-latest-hf-all-MiniLM-L6-v2

      - name: Run Postgres integration tests
        env:
          POSTGRES_DSN: "postgresql://genome:genome@localhost:5432/memorydb"
        run: pytest tests/memory/test_postgres_store.py -v

  # Separate job: a default install resolves mcp 2.x, so without this the mcp 1.x
  # (FastMCP) path of genome/mcp/server.py is never tested, though pyproject still
  # supports it. Two points on the 1.x line, each with the newest pydantic: the
  # floor (1.21.1; 1.21.0 and older fail to import with pydantic 2.14+) and the
  # newest 1.x.
  test-mcp1x:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp==1.21.1", "mcp<2"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with ${{ matrix.mcp }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.mcp }}"

      - name: Confirm an mcp 1.x SDK and pydantic 2.14 or newer got installed
        run: python -c "import importlib.metadata as m; from packaging.version import Version; v, p = m.version('mcp'), m.version('pydantic'); print('mcp', v, 'pydantic', p); assert v.startswith('1.'), v; assert Version(p) >= Version('2.14'), p"

      - name: Run the MCP server tests
        run: pytest tests/test_mcp_server.py tests/test_mcp_forget.py -v
